<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelScrape — Autonomous Scraping Trust Layer & Observability Platform</title>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter, Geist, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        geist: ['Geist', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            950: '#030712',
                            900: '#0F172A',
                            800: '#1E293B',
                            700: '#334155',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'beam': 'beam 2s linear infinite',
                        'scanline': 'scanline 6s linear infinite',
                        'shutter-down': 'shutterDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'shutter-up': 'shutterUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'beacon-glow': 'beaconGlow 1s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        beam: {
                            '0%': { transform: 'translateX(-100%)', opacity: '0' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translateX(100%)', opacity: '0' }
                        },
                        shutterDown: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(0%)' }
                        },
                        shutterUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0%)' }
                        },
                        beaconGlow: {
                            '0%': { opacity: '0.2', boxShadow: '0 0 10px #F43F5E' },
                            '100%': { opacity: '0.9', boxShadow: '0 0 40px #F43F5E' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #030712;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        .font-geist { font-family: 'Geist', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* THEME PRESET STYLING VARIABLES */
        .theme-cyan {
            --accent-color: #06B6D4;
            --accent-glow: rgba(6, 182, 212, 0.25);
            --card-border: rgba(6, 182, 212, 0.2);
        }
        .theme-cyberpunk {
            --accent-color: #E11D48;
            --accent-glow: rgba(225, 29, 72, 0.3);
            --card-border: rgba(225, 29, 72, 0.3);
        }
        .theme-matrix {
            --accent-color: #10B981;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --card-border: rgba(16, 185, 129, 0.3);
        }
        .theme-void {
            --accent-color: #A855F7;
            --accent-glow: rgba(168, 85, 247, 0.3);
            --card-border: rgba(168, 85, 247, 0.3);
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.08));
            border-radius: 20px;
            transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        .glass-card:hover {
            border-color: var(--accent-color, #06B6D4);
            box-shadow: 0 20px 40px -15px var(--accent-glow, rgba(6, 182, 212, 0.2));
        }

        /* CRT Scanline Overlay */
        .crt-scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 40;
            pointer-events: none;
            opacity: 0.35;
        }

        /* 3D Grid Plane */
        .cyber-grid-plane {
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(600px) rotateX(65deg);
            animation: gridScroll 18s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gridScroll {
            0% { transform: perspective(600px) rotateX(65deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(65deg) translateY(40px); }
        }

        /* Mechanical Shutter Overlay */
        .shutter-blade-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background: linear-gradient(180deg, #090D16 80%, #F43F5E 100%);
            border-bottom: 4px solid #F43F5E;
            box-shadow: 0 0 40px #F43F5E;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .shutter-blade-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50vh;
            background: linear-gradient(0deg, #090D16 80%, #F43F5E 100%);
            border-top: 4px solid #F43F5E;
            box-shadow: 0 0 40px #F43F5E;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Streams */
        .particle-stream {
            background: linear-gradient(90deg, transparent, #06B6D4, #10B981, transparent);
            box-shadow: 0 0 20px #06B6D4, 0 0 35px #10B981;
        }
        .particle-stream-red {
            background: linear-gradient(90deg, transparent, #F43F5E, transparent);
            box-shadow: 0 0 20px #F43F5E;
        }

        .gauge-circle {
            transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.5s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative antialiased selection:bg-cyan-500/30 selection:text-cyan-200 theme-cyan">
    
    <!-- 3D CYBER GRID BACKGROUND -->
    <div class="cyber-grid-plane"></div>

    <!-- CANVAS INTERACTIVE MATRIX & PARTICLE RAIN -->
    <canvas id="cyber-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- CRT SCANLINE OVERLAY -->
    <div id="crt-overlay" class="crt-scanlines hidden"></div>

    <!-- MECHANICAL SHUTTER OVERLAY (TRIGGERS ON TRUST GATE SLAM) -->
    <div id="shutter-top" class="shutter-blade-top -translate-y-full flex items-end justify-center pb-4">
        <span class="font-mono text-sm font-black text-white tracking-widest uppercase bg-rose-950 px-4 py-1 rounded border border-rose-500 shadow-xl">
            🛑 EMERGENCY TRUST GATE INTERACTION SHUTTER
        </span>
    </div>
    <div id="shutter-bottom" class="shutter-blade-bottom translate-y-full flex items-start justify-center pt-4">
        <span class="font-mono text-xs font-bold text-rose-300 tracking-wider">
            UNTRUSTED SCRAPE PAYLOAD HALTED BEFORE LLM INGEST
        </span>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- SPEECH SYNTHESIS VOICE ASSISTANT ---
        const speakVoiceAlert = (text, enabled = true) => {
            if (!enabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel(); // Stop prior speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.1;
                utterance.rate = 1.05;
                utterance.volume = 0.8;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        };

        // --- CYBER SOUND FX SYNTHESIZER ---
        const playCyberSFX = (type, enabled = true) => {
            if (!enabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                if (type === 'hover') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(850, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1300, ctx.currentTime + 0.03);
                    gain.gain.setValueAtTime(0.015, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.03);
                } else if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.06);
                } else if (type === 'slam') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.45);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.45);
                } else if (type === 'step') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(650, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'success') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.07);
                        gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.07);
                        osc.stop(ctx.currentTime + i * 0.07 + 0.3);
                    });
                }
            } catch (e) {}
        };

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block align-middle ${className}`}></i>;
        };

        // --- MOCK PRESET TARGETS ---
        const TARGET_PRESETS = [
            {
                url: 'https://example.com/product/1001',
                query: 'Extract user review sentiment, pricing specifications, and seller merchant metrics.',
                name: 'E-Commerce Target 1001',
                collectorId: 'c_98a120',
                brokenField: 'pricing_data',
                oldSelector: '//div[@id="product-price"]/span',
                fixedSelector: '//span[@data-test="sale-price"]',
                sampleValue: '$149.99'
            },
            {
                url: 'https://amazon.com/dp/B08X92K01',
                query: 'Extract seller metrics, prime status, and ratings history',
                name: 'Amazon Electronics Catalog',
                collectorId: 'c_8f2a91',
                brokenField: 'prime_status',
                oldSelector: '.a-icon-prime-v2',
                fixedSelector: '[data-prime-tag="true"]',
                sampleValue: 'Eligible (One-Day Delivery)'
            },
            {
                url: 'https://bloomberg.com/markets/equities',
                query: 'Analyze ticker P/E ratio drift and market capitalization',
                name: 'Bloomberg Financial Data Pipeline',
                collectorId: 'c_471b02',
                brokenField: 'pe_ratio',
                oldSelector: '.security-summary .pe-ratio-val',
                fixedSelector: 'td[data-stat="pe_ratio_ttm"]',
                sampleValue: '28.45'
            }
        ];

        function App() {
            // Active View Selection
            const [activeView, setActiveView] = useState('input');

            // HUD Controls
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [voiceEnabled, setVoiceEnabled] = useState(true);
            const [crtEnabled, setCrtEnabled] = useState(false);
            const [theme, setTheme] = useState('cyan'); // 'cyan' | 'cyberpunk' | 'matrix' | 'void'

            // Target Inputs
            const [targetUrl, setTargetUrl] = useState('https://example.com/product/1001');
            const [extractionQuery, setExtractionQuery] = useState(TARGET_PRESETS[0].query);
            const [selectedPreset, setSelectedPreset] = useState(TARGET_PRESETS[0]);

            // Reliability & Gate State
            const [trustScore, setTrustScore] = useState(98.0);
            const [gateStatus, setGateStatus] = useState('HEALTHY');
            const [gateOpen, setGateOpen] = useState(true);
            const [isSimulating, setIsSimulating] = useState(false);
            const [healingStep, setHealingStep] = useState(0);

            // Time Travel Historical Scrape Run (0..9)
            const [historicalRun, setHistoricalRun] = useState(9);

            // AI Model Destination
            const [selectedModel, setSelectedModel] = useState('gemini-1.5-pro');

            // Gemini Interactive RAG Sandbox Query State
            const [ragQuery, setRagQuery] = useState('Summarize verified consumer complaints & specs');
            const [ragResponse, setRagResponse] = useState('');
            const [isRagLoading, setIsRagLoading] = useState(false);

            // Interactive XPath Playground
            const [customXpath, setCustomXpath] = useState('//span[@data-test="sale-price"]');
            const [xpathResult, setXpathResult] = useState({ match: true, confidence: 99.4, value: '$149.99' });

            // Log Console Stream
            const [logs, setLogs] = useState([
                { time: '14:32:01', level: 'INFO', text: 'Initializing Bright Data Scraper Studio proxy mesh...' },
                { time: '14:32:02', level: 'SUCCESS', text: 'DOM Schema parsed successfully. Validation score: 98.0%' },
                { time: '14:32:04', level: 'SUCCESS', text: 'Payload verified clean. Routing to downstream Gemini 1.5 Pro API' }
            ]);

            const logEndRef = useRef(null);

            // 3D PARALLAX CARD TILT EFFECT ON MOUSEMOVE
            const handleCardMouseMove = (e) => {
                const card = e.currentTarget;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                card.style.transform = `perspective(1000px) rotateX(${-y / 25}deg) rotateY(${x / 25}deg) scale3d(1.01, 1.01, 1.01)`;
            };

            const handleCardMouseLeave = (e) => {
                e.currentTarget.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            };

            // CANVAS MATRIX RAIN & AUDIO EQUALIZER SPECTRUM
            useEffect(() => {
                const canvas = document.getElementById('cyber-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                let w = (canvas.width = window.innerWidth);
                let h = (canvas.height = window.innerHeight);

                const handleResize = () => {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                const chars = '0101010101010101XYZ01';
                const fontSize = 12;
                const columns = Math.floor(w / fontSize);
                const drops = Array(columns).fill(1);

                const render = () => {
                    ctx.fillStyle = 'rgba(3, 7, 18, 0.15)';
                    ctx.fillRect(0, 0, w, h);

                    ctx.fillStyle = gateOpen ? 'rgba(6, 182, 212, 0.35)' : 'rgba(244, 63, 94, 0.45)';
                    ctx.font = `${fontSize}px JetBrains Mono`;

                    for (let i = 0; i < drops.length; i++) {
                        const text = chars.charAt(Math.floor(Math.random() * chars.length));
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                        if (drops[i] * fontSize > h && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        drops[i]++;
                    }
                    animId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(animId);
                };
            }, [gateOpen]);

            // Auto Scroll Log
            useEffect(() => {
                if (logEndRef.current) logEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            // Helper to add log line
            const addLog = (level, text) => {
                const now = new Date();
                const timeStr = now.toTimeString().split(' ')[0];
                setLogs(prev => [...prev.slice(-40), { time: timeStr, level, text }]);
            };

            // Switch Theme Presets
            const changeTheme = (newTheme) => {
                setTheme(newTheme);
                document.body.className = `bg-slate-950 text-slate-100 min-h-screen relative antialiased theme-${newTheme}`;
                playCyberSFX('click', soundEnabled);
            };

            // Preset Selector
            const handlePresetSelect = (preset) => {
                setSelectedPreset(preset);
                setTargetUrl(preset.url);
                setExtractionQuery(preset.query);
                setCustomXpath(preset.fixedSelector);
                addLog('INFO', `Target switched to ${preset.name} (${preset.url})`);
            };

            // Run Scrape Analysis
            const runAnalysis = () => {
                playCyberSFX('click', soundEnabled);
                addLog('INFO', `▶ Executing Bright Data scraper on ${targetUrl}...`);
                speakVoiceAlert("Analysis started. Scrape ingested.", voiceEnabled);
                setTimeout(() => {
                    addLog('SUCCESS', `Scrape complete. Sentinel Trust Score evaluated at ${trustScore.toFixed(1)}%.`);
                }, 600);
            };

            // Trigger Mechanical Shutter & Auto-Healing Simulation
            const triggerAnomalySimulation = () => {
                if (isSimulating) return;
                setIsSimulating(true);
                playCyberSFX('slam', soundEnabled);
                speakVoiceAlert("Alert. DOM Mutation detected. Trust gate closed.", voiceEnabled);

                // Animate Dual-Blade Mechanical Shutters
                const topShutter = document.getElementById('shutter-top');
                const bottomShutter = document.getElementById('shutter-bottom');
                if (topShutter && bottomShutter) {
                    topShutter.classList.remove('-translate-y-full');
                    bottomShutter.classList.remove('translate-y-full');
                    setTimeout(() => {
                        topShutter.classList.add('-translate-y-full');
                        bottomShutter.classList.add('translate-y-full');
                    }, 900);
                }

                // Step 1: Drop Score, Divert Gate
                setTrustScore(42.0);
                setGateStatus('DIVERTED');
                setGateOpen(false);
                setHealingStep(1);

                addLog('WARN', `⚠️ CRITICAL: DOM Mutation detected on ${targetUrl}`);
                addLog('ERROR', `Validation Failure: Field '${selectedPreset.brokenField}' returned null using selector ${selectedPreset.oldSelector}`);
                addLog('ERROR', `[TRUST GATE SLAMMED SHUT] Trust score dropped to 42.0%. Scrape payload DIVERTED.`);

                const delay = 1300;

                setTimeout(() => {
                    setHealingStep(2);
                    setGateStatus('HEALING');
                    playCyberSFX('step', soundEnabled);
                    addLog('INFO', `[SELF-HEALING 2/5] Inspecting DOM diffs & CSS mutations...`);

                    setTimeout(() => {
                        setHealingStep(3);
                        playCyberSFX('step', soundEnabled);
                        addLog('WARN', `$ bdata scraper heal --field ${selectedPreset.brokenField} --target ${targetUrl}`);

                        setTimeout(() => {
                            setHealingStep(4);
                            playCyberSFX('step', soundEnabled);
                            addLog('INFO', `[SELF-HEALING 4/5] Auto-repair isolated fallback XPath: '${selectedPreset.fixedSelector}'`);

                            setTimeout(() => {
                                setHealingStep(5);
                                setTrustScore(98.3);
                                setGateStatus('RESTORED');
                                setGateOpen(true);
                                playCyberSFX('success', soundEnabled);
                                speakVoiceAlert("Self healing complete. Reliability restored.", voiceEnabled);
                                addLog('SUCCESS', `✓ HEALING COMPLETE: Field '${selectedPreset.brokenField}' restored. Trust score updated to 98.3%`);
                                addLog('SUCCESS', `[TRUST GATE RE-OPENED] Verified clean payload dispatched to ${selectedModel}.`);
                                setIsSimulating(false);
                            }, delay);
                        }, delay);
                    }, delay);
                }, delay);
            };

            // Simulate Gemini AI RAG Query Output
            const executeGeminiRagQuery = () => {
                if (isRagLoading) return;
                setIsRagLoading(true);
                playCyberSFX('click', soundEnabled);
                setRagResponse('');

                const fullText = `[GEMINI 1.5 PRO SYNTHESIS RESPONSE]\n\n` +
                    `✓ Trust-Verified Scrape Payload Ingested (Reliability Score: ${trustScore.toFixed(1)}%)\n` +
                    `• Target URL: ${targetUrl}\n` +
                    `• Verified Result: ${selectedPreset.sampleValue}\n` +
                    `• Integrity Analysis: Zero null-pointer anomalies detected post-auto-heal. Downstream context clean and safe for agentic reasoning.\n\n` +
                    `Status: Verified safe for Gemini 1.5 Pro Context Window.`;

                let i = 0;
                const interval = setInterval(() => {
                    setRagResponse(prev => prev + fullText.charAt(i));
                    i++;
                    if (i >= fullText.length) {
                        clearInterval(interval);
                        setIsRagLoading(false);
                        playCyberSFX('success', soundEnabled);
                    }
                }, 15);
            };

            // Evaluate Custom XPath in Playground
            const testXpathInPlayground = (xpath) => {
                setCustomXpath(xpath);
                playCyberSFX('click', soundEnabled);
                if (xpath.includes('sale-price') || xpath.includes('prime') || xpath.includes('pe_ratio')) {
                    setXpathResult({ match: true, confidence: 99.4, value: selectedPreset.sampleValue });
                } else {
                    setXpathResult({ match: false, confidence: 0.0, value: 'null (Element Not Found)' });
                }
            };

            // Colors based on trust score
            const scoreColor = trustScore >= 90 
                ? { text: 'text-emerald-400', stroke: '#10B981', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' }
                : trustScore >= 70
                ? { text: 'text-amber-400', stroke: '#F59E0B', bg: 'bg-amber-500/10', border: 'border-amber-500/30' }

                                            <h3 className="font-geist font-bold text-sm text-slate-200 flex items-center gap-2">
                                                <Icon name="sparkles" size={18} className="text-emerald-400" />
                                                Interactive Gemini 1.5 Pro RAG Synthesis Terminal
                                            </h3>
                                            <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/30">
                                                Context: Sentinel Verified Clean Payload
                                            </span>
                                        </div>

                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={ragQuery}
                                                onChange={(e) => setRagQuery(e.target.value)}
                                                className="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-2 text-xs font-mono text-slate-200 outline-none focus:border-emerald-500"
                                            />
                                            <button 
                                                onClick={executeGeminiRagQuery}
                                                disabled={isRagLoading}
                                                className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs font-mono flex items-center gap-1.5 shadow-lg shadow-emerald-500/20"
                                            >
                                                <Icon name={isRagLoading ? "loader-2" : "send"} size={14} className={isRagLoading ? "animate-spin" : ""} />
                                                {isRagLoading ? 'Synthesizing...' : 'Synthesize Context'}
                                            </button>
                                        </div>

                                        {ragResponse && (
                                            <div className="p-4 rounded-xl bg-slate-950 border border-emerald-500/40 text-emerald-300 font-mono text-xs whitespace-pre-wrap leading-relaxed shadow-inner">
                                                {ragResponse}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* BOTTOM STEPPER NAV */}
                    <footer className="fixed bottom-0 left-0 right-0 z-50 glass-panel border-t border-slate-800/80 px-4 py-3">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-2">
                            <div className="flex-1 grid grid-cols-4 gap-2">
                                <button
                                    onClick={() => { setActiveView('input'); playCyberSFX('click', soundEnabled); }}
                                    className={`p-2.5 rounded-xl border text-left transition-all ${
                                        activeView === 'input' 
                                            ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300 shadow-lg' 
                                            : 'bg-slate-900/60 border-slate-800/80 text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <div className="text-[10px] font-mono uppercase font-bold text-slate-400">Step 1</div>
                                    <div className="text-xs font-bold truncate">Scrape Input</div>
                                </button>

                                <button
                                    onClick={() => { setActiveView('lab'); playCyberSFX('click', soundEnabled); }}
                                    className={`p-2.5 rounded-xl border text-left transition-all ${
                                        activeView === 'lab' 
                                            ? 'bg-amber-500/20 border-amber-500/50 text-amber-300 shadow-lg' 
                                            : 'bg-slate-900/60 border-slate-800/80 text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <div className="text-[10px] font-mono uppercase font-bold text-slate-400">Step 2</div>
                                    <div className="text-xs font-bold truncate">Diagnostic Lab</div>
                                </button>

                                <button
                                    onClick={() => { setActiveView('gate'); playCyberSFX('click', soundEnabled); }}
                                    className={`p-2.5 rounded-xl border text-left transition-all ${
                                        activeView === 'gate' 
                                            ? 'bg-rose-500/20 border-rose-500/50 text-rose-300 shadow-lg' 
                                            : 'bg-slate-900/60 border-slate-800/80 text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <div className="text-[10px] font-mono uppercase font-bold text-slate-400">Step 3</div>
                                    <div className="text-xs font-bold truncate">Trust Gate / Diversion</div>
                                </button>

                                <button
                                    onClick={() => { setActiveView('hub'); playCyberSFX('click', soundEnabled); }}
                                    className={`p-2.5 rounded-xl border text-left transition-all ${
                                        activeView === 'hub' 
                                            ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 shadow-lg' 
                                            : 'bg-slate-900/60 border-slate-800/80 text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <div className="text-[10px] font-mono uppercase font-bold text-slate-400">Step 4</div>
                                    <div className="text-xs font-bold truncate">AI Destination Hub</div>
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
